# Netlify's default cache-control is public,max-age=0,must-revalidate: the
# browser revalidates every asset on every visit. Vite emits content-hashed
# filenames into assets/, so those responses can cache immutable instead.
# Everything else (index.html, sw.js, unhashed files in public/) keeps the
# default and stays revalidated — or is served from the service-worker
# precache on repeat visits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# version.json must always come from the network: the version-check
# banner compares it against the running bundle to offer an update
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# sw-kill.js is the self-unregistering worker served at the retired
# origins' /sw.js (see public/_redirects) and must never come from a
# cache. /sw.js headers matter on those origins too — headers apply to
# the requested path; on promote-species.app the same rule only makes
# the real worker's default (max-age=0, must-revalidate) explicit.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw-kill.js"
  [headers.values]
    Cache-Control = "no-cache"

# Baseline for every response. Netlify sends the HSTS header by default; it is
# spelled out so the policy is visible. No includeSubDomains: auth, api and
# sync set their own (backend/caddy/Caddyfile), and a future subdomain stays
# free to choose. The app is not framed anywhere, so framing is refused. Of the
# policy-controlled features the app only uses geolocation.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=()"
